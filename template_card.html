<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 1080px;
    height: 1920px;
    background-color: #ffffff;
    font-family: "Noto Sans SC", "Noto Sans JP", "Noto Sans KR", sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* 图片区域固定占上半区 1080x1080 */
.img-wrap {
    width: 1080px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
}

.main-img {
    width: 1080px;
    height: 1080px;
    object-fit: contain;
}

/* 文字区域固定 1080x840，自动均分垂直空间 */
.text-container {
    width: 1080px;
    height: 840px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    z-index: 1;
}

.line {
    font-weight: 700;
    font-size: 72px;
    color: #222222;
    line-height: 1.3;
    text-align: center;
}

/* 底部版权小字 */
.footer-copyright {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 30px;
    text-align: center;
    font-size: 28px;
    color: #999999;
    z-index: 2;
    letter-spacing: 1px;
}
</style>
</head>
<body>
    <div class="img-wrap">
        <img class="main-img" src="{{IMG_BASE64}}">
    </div>

    <div class="text-container">
        <div class="line">{{en_US}}</div>
        <div class="line">{{zh_CN}}</div>
        <div class="line">{{ko_KR}}</div>
        <div class="line">{{jp_JP}}</div>
        <div class="line">{{jp_RO}}</div>
    </div>

    <div class="footer-copyright">Copyright © 2026 文画卷</div>
</body>
</html>
